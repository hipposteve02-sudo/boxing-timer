<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Boxing Timer</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="theme-color" content="#e63946">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --red:     #e63946;
            --green:   #2dc653;
            --yellow:  #ffc300;
            --bg:      #0d0d0d;
            --surface: #1a1a1a;
            --border:  #2e2e2e;
            --text:    #f5f5f5;
            --muted:   #777;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
            gap: 28px;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        h1 {
            font-size: clamp(1.1rem, 4vw, 1.6rem);
            font-weight: 900;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--red);
        }

        /* ── Settings ─────────────────────────────────────────────────────── */
        .settings {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 460px;
            transition: opacity 0.3s;
        }

        .settings.locked {
            opacity: 0.3;
            pointer-events: none;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .setting-group label {
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--muted);
        }

        select {
            width: 100%;
            padding: 10px 8px;
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            -webkit-appearance: none;
            appearance: none;
            outline: none;
        }

        select:focus { border-color: var(--red); }

        /* ── Timer display ────────────────────────────────────────────────── */
        .timer-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            width: 100%;
        }

        .round-info {
            font-size: clamp(0.75rem, 2.5vw, 0.95rem);
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--muted);
            min-height: 1.4em;
        }

        .phase-label {
            font-size: clamp(1.2rem, 5vw, 1.8rem);
            font-weight: 900;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            min-height: 1.3em;
            transition: color 0.4s;
        }

        .phase-fight { color: var(--red); }
        .phase-rest  { color: var(--green); }
        .phase-done  { color: var(--yellow); }

        .countdown {
            font-size: clamp(5.5rem, 24vw, 10rem);
            font-weight: 900;
            font-variant-numeric: tabular-nums;
            line-height: 0.95;
            letter-spacing: -0.03em;
            transition: color 0.3s;
        }

        .time-fight   { color: var(--text); }
        .time-warning { color: var(--yellow); animation: pulse 0.6s ease-in-out infinite; }
        .time-rest    { color: var(--green); }
        .time-done    { color: var(--muted); }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.5; }
        }

        .progress-wrap {
            width: 100%;
            max-width: 460px;
            height: 5px;
            background: var(--border);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.95s linear, background-color 0.4s;
        }

        .bar-fight { background: var(--red); }
        .bar-rest  { background: var(--green); }

        /* ── Controls ─────────────────────────────────────────────────────── */
        .controls {
            display: flex;
            gap: 12px;
        }

        .btn {
            min-width: 130px;
            padding: 15px 32px;
            border: none;
            border-radius: 10px;
            font-size: clamp(0.85rem, 3vw, 1rem);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            cursor: pointer;
            transition: transform 0.1s ease, opacity 0.1s ease;
        }

        .btn:active { transform: scale(0.95); }

        .btn-start { background: var(--red);    color: #fff; }
        .btn-pause { background: var(--yellow); color: #111; }
        .btn-reset { background: var(--surface); color: var(--muted); border: 1px solid var(--border); }

        /* ── Round dots ───────────────────────────────────────────────────── */
        .dots {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            max-width: 460px;
        }

        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--surface);
            border: 2px solid var(--border);
            transition: all 0.35s;
        }

        .dot-done   { background: var(--red); border-color: var(--red); }
        .dot-active { background: transparent; border-color: var(--text); box-shadow: 0 0 0 3px rgba(255,255,255,0.15); }

        @media (max-width: 360px) {
            .btn { min-width: 100px; padding: 14px 20px; }
        }
    </style>
</head>
<body>

    <h1>Boxing Timer</h1>

    <div class="settings" id="settings">
        <div class="setting-group">
            <label>Rounds</label>
            <select id="selRounds"></select>
        </div>
        <div class="setting-group">
            <label>Round Time</label>
            <select id="selRound"></select>
        </div>
        <div class="setting-group">
            <label>Rest Time</label>
            <select id="selRest"></select>
        </div>
    </div>

    <div class="timer-display">
        <div class="round-info"               id="elRoundInfo">Round 1 of 3</div>
        <div class="phase-label phase-fight"  id="elPhase">Fight</div>
        <div class="countdown time-fight"     id="elTime">3:00</div>
        <div class="progress-wrap">
            <div class="progress-fill bar-fight" id="elBar" style="width:100%"></div>
        </div>
    </div>

    <div class="controls">
        <button class="btn btn-start" id="btnStart" onclick="handleStart()">Start</button>
        <button class="btn btn-reset"              onclick="handleReset()">Reset</button>
    </div>

    <div class="dots" id="elDots"></div>

    <script>
    'use strict';

    // ── Populate selects ──────────────────────────────────────────────────────
    const selRounds = document.getElementById('selRounds');
    const selRound  = document.getElementById('selRound');
    const selRest   = document.getElementById('selRest');

    for (let i = 1; i <= 12; i++) {
        selRounds.add(new Option(i, i, i === 3, i === 3));
    }

    [['30 sec',30],['1 min',60],['1:30',90],['2 min',120],['2:30',150],['3 min',180]].forEach(([t,v]) => {
        selRound.add(new Option(t, v, v === 180, v === 180));
    });

    [['15 sec',15],['30 sec',30],['45 sec',45],['1 min',60]].forEach(([t,v]) => {
        selRest.add(new Option(t, v, v === 60, v === 60));
    });

    selRounds.onchange = selRound.onchange = selRest.onchange = handleReset;

    // ── Audio (Web Audio API — no internet needed) ────────────────────────────
    let audioCtx = null;
    function getAC() {
        return audioCtx ?? (audioCtx = new (window.AudioContext || window.webkitAudioContext)());
    }

    function tone(freq, dur, vol = 0.5, type = 'sine') {
        const ctx = getAC();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(vol, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
        osc.start();
        osc.stop(ctx.currentTime + dur);
    }

    // Boxing bell: two overlapping tones for a metallic ring
    function bell() {
        tone(880, 1.8, 0.55, 'sine');
        setTimeout(() => tone(1100, 1.2, 0.2, 'sine'), 40);
    }

    // Three bells at end of a round
    function tripleBell() {
        bell();
        setTimeout(bell, 620);
        setTimeout(bell, 1240);
    }

    // Short warning beep at 10-second mark
    function warnBeep() {
        tone(660, 0.12, 0.45, 'square');
    }

    // ── State ─────────────────────────────────────────────────────────────────
    let tid     = null;
    let running = false;
    let warned  = false;
    let phase   = 'idle'; // idle | fight | rest | done
    let timeLeft  = 0;
    let totalTime = 0;
    let round     = 1;
    let nRounds   = 3;
    let roundSecs = 180;
    let restSecs  = 60;
    let wakeLock  = null;

    // ── DOM refs ──────────────────────────────────────────────────────────────
    const elRoundInfo = document.getElementById('elRoundInfo');
    const elPhase     = document.getElementById('elPhase');
    const elTime      = document.getElementById('elTime');
    const elBar       = document.getElementById('elBar');
    const elDots      = document.getElementById('elDots');
    const elSettings  = document.getElementById('settings');
    const btnStart    = document.getElementById('btnStart');

    // ── Helpers ───────────────────────────────────────────────────────────────
    function fmt(s) {
        return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    }

    function buildDots() {
        elDots.innerHTML = '';
        for (let i = 1; i <= nRounds; i++) {
            const d = document.createElement('div');
            d.className = 'dot';
            d.id = `dot${i}`;
            elDots.appendChild(d);
        }
    }

    function refreshDots() {
        for (let i = 1; i <= nRounds; i++) {
            const d = document.getElementById(`dot${i}`);
            if (phase === 'done' || i < round) {
                d.className = 'dot dot-done';
            } else if (i === round && phase === 'fight') {
                d.className = 'dot dot-active';
            } else {
                d.className = 'dot';
            }
        }
    }

    function render() {
        const pct = totalTime ? (timeLeft / totalTime * 100) : 0;

        if (phase === 'fight') {
            elRoundInfo.textContent = `Round ${round} of ${nRounds}`;
            elPhase.textContent = 'Fight';
            elPhase.className = 'phase-label phase-fight';
            elTime.textContent = fmt(timeLeft);
            elTime.className = `countdown ${timeLeft <= 10 ? 'time-warning' : 'time-fight'}`;
            elBar.className = 'progress-fill bar-fight';
            elBar.style.width = `${pct}%`;
        } else if (phase === 'rest') {
            elRoundInfo.textContent = `Rest — Round ${round + 1} up next`;
            elPhase.textContent = 'Rest';
            elPhase.className = 'phase-label phase-rest';
            elTime.textContent = fmt(timeLeft);
            elTime.className = 'countdown time-rest';
            elBar.className = 'progress-fill bar-rest';
            elBar.style.width = `${pct}%`;
        } else if (phase === 'done') {
            elRoundInfo.textContent = 'Workout Complete!';
            elPhase.textContent = 'Done';
            elPhase.className = 'phase-label phase-done';
            elTime.textContent = fmt(0);
            elTime.className = 'countdown time-done';
            elBar.style.width = '0%';
        }

        refreshDots();
    }

    // ── Tick ──────────────────────────────────────────────────────────────────
    function tick() {
        if (timeLeft > 0) {
            timeLeft--;
            if (phase === 'fight' && timeLeft === 10 && !warned) {
                warned = true;
                warnBeep();
            }
            render();
        } else {
            clearInterval(tid);
            tid = null;

            if (phase === 'fight') {
                if (round < nRounds) {
                    tripleBell();
                    phase = 'rest';
                    timeLeft = restSecs;
                    totalTime = restSecs;
                    warned = false;
                    render();
                    tid = setInterval(tick, 1000);
                } else {
                    tripleBell();
                    phase = 'done';
                    running = false;
                    btnStart.textContent = 'Start';
                    btnStart.className = 'btn btn-start';
                    render();
                    releaseWakeLock();
                }
            } else if (phase === 'rest') {
                round++;
                phase = 'fight';
                timeLeft = roundSecs;
                totalTime = roundSecs;
                warned = false;
                bell();
                render();
                tid = setInterval(tick, 1000);
            }
        }
    }

    // ── Wake Lock (keeps screen on during workout) ────────────────────────────
    async function requestWakeLock() {
        try {
            if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
        } catch (_) {}
    }

    function releaseWakeLock() {
        try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch (_) {}
    }

    // Re-acquire if tab comes back into view while running
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && running) requestWakeLock();
    });

    // ── Controls ──────────────────────────────────────────────────────────────
    function handleStart() {
        if (phase === 'done') { handleReset(); return; }

        if (!running) {
            if (phase === 'idle') {
                nRounds   = +selRounds.value;
                roundSecs = +selRound.value;
                restSecs  = +selRest.value;
                round = 1;
                phase = 'fight';
                timeLeft = roundSecs;
                totalTime = roundSecs;
                warned = false;
                buildDots();
                render();
                elSettings.classList.add('locked');
                bell();
                requestWakeLock();
            }
            running = true;
            btnStart.textContent = 'Pause';
            btnStart.className = 'btn btn-pause';
            tid = setInterval(tick, 1000);
        } else {
            running = false;
            clearInterval(tid);
            tid = null;
            btnStart.textContent = 'Resume';
            btnStart.className = 'btn btn-start';
            releaseWakeLock();
        }
    }

    function handleReset() {
        clearInterval(tid);
        tid = null;
        running = false;
        phase = 'idle';
        round = 1;
        warned = false;
        nRounds   = +selRounds.value;
        roundSecs = +selRound.value;
        restSecs  = +selRest.value;
        timeLeft  = roundSecs;
        totalTime = roundSecs;
        btnStart.textContent = 'Start';
        btnStart.className = 'btn btn-start';
        elSettings.classList.remove('locked');
        elRoundInfo.textContent = `Round 1 of ${nRounds}`;
        elPhase.textContent = 'Fight';
        elPhase.className = 'phase-label phase-fight';
        elTime.textContent = fmt(roundSecs);
        elTime.className = 'countdown time-fight';
        elBar.className = 'progress-fill bar-fight';
        elBar.style.width = '100%';
        buildDots();
        releaseWakeLock();
    }

    // ── Init ──────────────────────────────────────────────────────────────────
    handleReset();
    </script>
</body>
</html>
